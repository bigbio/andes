name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --workspace --locked

      - name: Test (release)
        run: cargo test --release --workspace

      - name: Out-of-core PIN goldens (issues #65, #70)
        # `#[ignore]`d because each runs a full E. coli search (~20 s release);
        # run explicitly here, on one lane, so they stay required.
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p andes --release --test out_of_core_pin_goldens -- --ignored

      - name: onnx-infer (tract + fixture models)
        # Default workspace test builds onnx-infer without engines. Tract is
        # opt-in; this lane exercises committed fixtures (double, intensity_mlp)
        # and always-on contracts (feature names, PeptDeep packing, manifests).
        run: cargo test -p onnx-infer --release --features tract

  lint:
    name: Lint (clippy + rustfmt)
    runs-on: ubuntu-latest
    # Clippy is REQUIRED after the PR-Q1 cleanup sweep (2026-05-26).
    # Rustfmt remains advisory until a future fmt-clean sweep lands
    # (~11k lines of cosmetic churn pending; tracked separately).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --workspace --locked

      - name: Test (release)
        run: cargo test --release --workspace

      - name: Out-of-core PIN goldens (issues #65, #70)
        # `#[ignore]`d because each runs a full E. coli search (~20 s release);
        # run explicitly here, on one lane, so they stay required.
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p andes --release --test out_of_core_pin_goldens -- --ignored

      - name: DDA rescore path goldens
        # `#[ignore]`d because each runs a full E. coli search with rescoring;
        # run explicitly here, on one lane, so they stay required.
        if: matrix.os == 'ubuntu-latest'
        run: cargo test -p andes --release --test dda_path_goldens -- --ignored

      - name: onnx-infer (tract + fixture models)
        # Default workspace test builds onnx-infer without engines. Tract is
        # opt-in; this lane exercises committed fixtures (double, intensity_mlp)
        # and always-on contracts (feature names, PeptDeep packing, manifests).
        run: cargo test -p onnx-infer --release --features tract

  lint:
    name: Lint (clippy + rustfmt)
    runs-on: ubuntu-latest
    # Clippy is REQUIRED after the PR-Q1 cleanup sweep (2026-05-26).
    # Rustfmt remains advisory until a future fmt-clean sweep lands
    # (~11k lines of cosmetic churn pending; tracked separately).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Benchmark evaluator tests (Python, stdlib only)
        run: python3 -I docs/benchmarks/tests/test_entrap.py

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  benchmarks:
    name: Benchmarks (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: python3 -m pip install numpy pandas scipy pyarrow

      - name: Benchmark tables match docs/benchmarks/results
        run: python3 -I docs/benchmarks/render.py --check

      - name: Benchmark page links and anchors
        run: python3 -I docs/benchmarks/check_links.py

      - name: Entrapment rules
        run: python3 -I docs/benchmarks/tests/test_entrap.py

      - name: ProteoBench converter
        run: python3 -I docs/benchmarks/tests/test_proteobench_convert.py

      - name: Truth-design smoke
        run: python3 tests/test_smoke.py
        working-directory: docs/benchmarks/quant-eval

      - name: Board metrics
        run: python3 tests/test_board_metrics.py
        working-directory: docs/benchmarks/quant-eval

      - name: Comparison
        run: python3 tests/test_compare.py
        working-directory: docs/benchmarks/quant-eval

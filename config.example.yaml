# andes run configuration (YAML) — pass with `andes --config this-file.yaml`.
#
# Every key is OPTIONAL; omitted keys keep their built-in default. An explicit
# CLI flag ALWAYS overrides the value here (precedence: CLI flag > config > default),
# so this file sets the baseline and you tweak individual runs on the command line.
#
# Sections are grouped by experimental design (see DOCS §1a / §1b). Tolerances,
# ranges, and enums are written exactly as on the CLI (e.g. "20ppm", "2..5", auto).
# Unknown keys are a hard error, so typos never silently no-op.

# ── Inputs / outputs ────────────────────────────────────────────────────────
io:
  spectrum: [sample.mzML]        # one or more files (mzML / MGF / .raw / .d)
  database: human.fasta          # target-only FASTA or UniProt XML (*.xml[.gz]); decoys per `decoys:`
  # uniprot_variants: false      # UniProt XML: search natural sequence variants as extra entries
  # uniprot_isoforms: false      # UniProt XML: search described isoforms as extra entries
  # uniprot_chains: false        # UniProt XML: search peptides at new mature-chain termini
  # uniprot_evidence: experimental  # UniProt XML: experimental | curated | any (variants, sites, chains)
  output_pin: out.pin            # Percolator PIN (required unless rescoring in-process)
  # output_tsv: out.tsv          # optional human-readable PSM table
  # output_parquet: out.idparquet

# ── Core search ─────────────────────────────────────────────────────────────
search:
  precursor_tol: 20ppm           # e.g. 20ppm or 0.02da
  charge: "2..5"                 # fallback charge range when the spectrum omits it
  isotope_error: "-1..2"
  enzyme: trypsin                # trypsin | lysc | gluc | ... | nonspecific | gluc,trypsin
  enzyme_specificity: fully      # fully | semi | non-specific
  max_missed_cleavages: 1
  min_length: 6
  max_length: 50
  mods: mods.txt                 # Java-format mods.txt (TMT/iTRAQ/phospho/etc.)
  # max_mods: 3
  # min_peaks: 10                # advanced
  # top_n: 10                    # advanced

# ── Scoring / model / runtime ───────────────────────────────────────────────
scoring:
  score: auto                    # auto | strong | rank
  precursor_cal: off             # off | auto | on
  threads: 8
  # fragmentation: auto          # MGF only (no metadata): auto | CID | ETD | HCD | UVPD
  # protocol: auto               # auto | TMT | iTRAQ | phospho | ...
  # fragment_tol_ppm: 20         # MGF only, mutually exclusive with fragment_tol_da
  # model_store: models.parquet  # custom / trained model store
  # model: hcd_qexactive_tryp    # force a specific model id

# ── Decoys & FDR strategy ───────────────────────────────────────────────────
decoys:
  strategy: reverse              # reverse | shuffle | none (input already has decoys)
  prefix: XXX_
  # suffix: _rev                 # for quantms-style suffixed decoy DBs

# ── Experiment modes (each opt-in; sub-knobs are advanced) ───────────────────
chimeric:
  enabled: false                 # co-isolated / co-fragmented peptide cascade
  # max_coisolated: 4
  # max_kl: 0.3

refine:
  enabled: false                 # PTM-discovery second pass
  # config: refine_tiers.yaml
  # select_psm_fdr: 0.01

rescoring:
  enabled: false                 # run Percolator in-process (else feed out.pin to Percolator)
  # fdr: 0.01                    # q-value threshold for filtered output
  # protein_fdr: 0.01            # protein-group q cutoff on the filtered output (default: none)
  # native: false                # non-production built-in GBDT rescorer

glyco:
  enabled: false                 # intact N-glycopeptide search
  # --- advanced (validated defaults; see DOCS §9) ---
  # tol_ppm: 20                  # glyco fragment tolerance (raise for ion-trap MS2)
  # max_peaks: 0                 # cap peaks for candidate generation (0 = no cap)
  # hcd_pair: true               # DEFAULT ON: generate from the paired HCD scan, score c/z on ETD
  #
  # The remaining glyco flags (glycan database, species, core-Y gate, retrieval
  # tolerance, ...) are CLI-only; see DOCS.md §9 for the full table.

quant:
  # tmt: tmt10                  # reporter-ion quantification: tmt6|tmt10|tmt11|tmt16|tmt18|tmt32|tmt35|itraq4|itraq8
  # tmt_level: 2                 # 2 = identified MS2, 3 = its SPS-MS3 scan
  # tmt_tol: 20ppm               # reporter m/z window (default 20ppm (10ppm tmt32/tmt35) high-res MS2 or tmt_level 3, 0.3da ion-trap MS2)
  # tmt_correction: lot.txt      # kit impurity sheet (quantms text form); default none
  # tmt_min_purity: 0.7          # quantification gate: precursor purity floor (0 = off)
  # tmt_max_pep: 0.05            # quantification gate: Percolator PEP cap (1 = off; needs rescoring)
  # tmt_min_sn: 0                # quantification gate: summed reporter S/N floor (0 = off; needs noise values)
  # lfq: false                   # label-free MS1 feature quantification
  # lfq_tol: 10ppm
  # lfq_rt_window: 60            # seconds around the identifying PSM
  # lfq_min_cosine: 0.7          # envelope cosine below which a feature is not accepted in lfq.parquet
  # lfq_feature_fdr: 0.05
  # dir: quant_out              # per-run <stem>.ms1.parquet + <stem>.quant.parquet for multi-run quantification
  # quant_fdr: 0.01              # PSM q-value cut for quant targets (default: rescoring fdr)
  # mbr: false                   # match-between-runs across the inputs (needs lfq and rescoring, 2+ inputs)
  # mbr_library_fdr: 0.01        # internal library entry gate (precursor-level), not a reported identification FDR
  # mbr_fdr: 0.05                # transfer quality q-value for transfer_ms1 (internal, not an identification FDR)
  # quant_feature_fdr: off       # identified-row quality q-value; above it: identified_below_threshold (internal); off (default) reports all

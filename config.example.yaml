# andes run configuration: `andes --config this-file.yaml`.
#
# Every key is optional; a key left out keeps its default. A flag on the command line wins over
# this file (command line > config > default). Unknown keys are an error.
# Values are written as on the command line ("20ppm", "2..5", auto). Every key below is commented
# out and shows its default, or an example value marked "(example)" when it has none; uncomment a
# key to set it. Only the example input and output paths are uncommented.
# Each comment names the key's flag; "advanced" flags are listed by `andes --help` only,
# "internal" ones by neither help. DOCS.md §1b describes the file.

# ── Input and output ────────────────────────────────────────────────────────
io:
  # uniprot_variants: false               # --uniprot-variants (advanced): UniProt XML: also search each natural sequence variant as its own entry
  # uniprot_isoforms: false               # --uniprot-isoforms (advanced): UniProt XML: also search each described isoform as its own entry
  # uniprot_chains: false                 # --uniprot-chains (advanced): UniProt XML: also search each mature chain or peptide whose ends differ from the precursor's
  # uniprot_evidence: experimental        # --uniprot-evidence (advanced): UniProt XML: least evidence of a variant, annotated site or chain that is used; experimental | curated | any
  # annotations: [db.annotations.parquet] # --annotations (advanced): Annotation file (<name>.annotations.parquet) of variants, sites and chains; repeatable (example)
  # knockoffs: 4                          # --knockoffs (advanced): Knockoff entries per single-residue variant, which estimate the variant FDR (0: none)
  # sdrf: design.sdrf.tsv                 # --sdrf: SDRF-Proteomics file: data files, protease, modifications, tolerance and labels (example)
  spectrum: [sample.mzML]                 # --spectrum: Spectrum file: mzML, MGF, Thermo .raw or Bruker .d; repeat for several runs (example)
  database: human.fasta                   # --database: Protein database: FASTA, or UniProt XML (.xml); either may be gzipped (example)
  output_pin: out.pin                     # --output-pin: Percolator PIN output (required unless --rescore is given) (example)
  # output_tsv: out.tsv                   # --output-tsv: Tab-separated PSM report (example)
  # output_parquet: out.idparquet         # --output-parquet: QPX .idparquet bundle directory (quantms-compatible) (example)
  # temp_dir: tmp                         # --temp-dir (advanced): Directory of the run's temporary files [default: the directory of the outputs] (example)

# ── Search ──────────────────────────────────────────────────────────────────
search:
  # enzyme: trypsin                     # --enzyme: Protease; a comma list (gluc,trypsin) cleaves at the sites of each one; trypsin | chymotrypsin | lysc | aspn | gluc | lysn | argc | alphalp | nocleavage | nonspecific
  # fixed_mods: ["Carbamidomethyl (C)"] # --fixed-mods: Fixed modifications, a list of Name (sites) [default: Carbamidomethyl (C)]
  # variable_mods: ["Oxidation (M)"]    # --variable-mods: Variable modifications, a list of Name (sites) [default: Oxidation (M), Acetyl (Protein N-term)] (example)
  # A list item is the command-line string or a map that adds the config-only settings (example):
  # variable_mods:
  #   - Oxidation (M)
  #   - {name: Phospho, sites: STY, neutral_loss: [97.976896], loss_class: phospho}
  #   - {name: GlyGly, sites: K, cleavage: blocked, diagnostic_ions: [215.1502, 198.1237]}
  #   - {name: Phospho, sites: Y, restrict_to: annotated}   # only at sites a UniProt XML database annotates
  #   - {name: MyTag, mass: 123.4567, sites: N-term}         # a custom mass, no UNIMOD lookup
  # precursor_tol: 20ppm                # --precursor-tol: Precursor mass tolerance in ppm or Da, e.g. 20ppm or 0.02da
  # charge: 2..5                        # --charge (advanced): Precursor charges tried when the spectrum records none, as MIN..MAX (or MIN-MAX)
  # isotope_error: 0..1                 # --isotope-error (advanced): Isotope-error offsets tried, as MIN..MAX (or MIN-MAX) [default: -1..2, 0..2 with --glyco or --xl] (example)
  # open_search: false                  # --open-search (advanced): Open (mass-offset) search: any peptide within --open-search-delta of the precursor
  # open_search_delta: "-100..300"      # --open-search-delta (advanced): Mass-offset window for --open-search, as MIN..MAX in Da [default: -100..300]
  # open_search_top_k: 100              # --open-search-top-k (advanced): Candidates scored per spectrum under --open-search [default: 100]
  # optimize: false                     # --optimize (advanced): Parameter search: grid precursor tolerance, top-N and charge on a sample, then run
  # max_missed_cleavages: 2             # --max-missed-cleavages (advanced): Missed cleavages per peptide (not applied to a non-specific digest)
  # enzyme_specificity: fully           # --enzyme-specificity (advanced): Peptide ends that must be cleavage sites; non-specific | semi | fully
  # min_length: 6                       # --min-length (advanced): Shortest peptide, in residues
  # max_length: 50                      # --max-length (advanced): Longest peptide, in residues
  # max_mods: 3                         # --max-mods (advanced): Variable modifications per peptide
  # min_peaks: 10                       # --min-peaks (advanced): Fewest peaks of a scored MS2 spectrum; spectra with fewer are skipped
  # top_n: 10                           # --top-n (advanced): PSMs kept per spectrum
  # dia: false                          # --dia: Data-independent acquisition: search every MS2 scan across its isolation window
  # dia_mobility_slices: 1              # --dia-mobility-slices (advanced): diaPASEF (.d) only: split each isolation window's mobility range into N slices
  # dia_ms1_tol_ppm: 5                  # --dia-ms1-tol-ppm (advanced): --dia MS1 gate: ppm tolerance for a candidate's monoisotopic peak in the survey scans
  # localize: ipf                       # --localize (advanced): Site localization of variable modifications (`ipf`); needs --rescore; ipf (example)
  # xl: "DSSO (K, Protein N-term)"      # --xl (advanced): Crosslink search into <base>.xl.tsv, linker as Name (sites), e.g. "DSSO"; several as "DSSO; DSBU" (experimental) (example)
  # A reagent the table (resources/crosslinkers.yaml) lacks is an entry of that file's schema (example):
  # xl:
  #   name: MyLinker
  #   sites: K, Protein N-term       # one end, or "end / end" for a heterobifunctional linker
  #   intact: {mass: 158.003765}     # or {composition: "H(6) C(6) O(3) S"} or {unimod: "Xlink:DSSO[158]"}
  #   stubs: [{name: alkene, mass: 54.010565}, {name: thiol, mass: 85.982635}]   # MS-cleavage stubs
  #   doublets: [[alkene, thiol]]    # reporter doublets, [light, heavy] stub names
  #   monolinks: [{name: water, mass: 176.01433}]
  # xl_linear_only: false               # --xl-linear-only (advanced): With --xl: search only linear and monolinked peptides and write their protein groups
  # fragment_index: auto                # --fragment-index (advanced): Candidate retrieval; auto | on | off
  # fragment_index_slice_da: 80         # --fragment-index-slice-da (advanced): Precursor-mass width of one fragment-index slice, in Da [default: from the memory budget] (example)
  # index_cache_dir: cache              # --index-cache-dir (advanced): Directory of the candidate-index cache [default: the directory of the outputs] (example)

# ── Calibration, model and runtime ──────────────────────────────────────────
scoring:
  # threads: 8                  # --threads: Worker threads [default: the number of logical CPUs] (example)
  # precursor_cal: "off"        # --precursor-cal (advanced): Precursor mass calibration pre-pass; off | auto | on
  # score: auto                 # --score (advanced): What ranks the candidates and fills the PIN RawScore; auto | rank | strong
  # fragmentation: auto         # --fragmentation (advanced): Fragmentation of MGF spectra (mzML, .raw and .d record it); auto | CID | ETD | HCD | UVPD
  # protocol: auto              # --protocol (advanced): Labelling or enrichment protocol, which selects the protocol model; auto | phospho | iTRAQ | iTRAQ-phospho | TMT | standard
  # fragment_tol_ppm: 20        # --fragment-tol-ppm (advanced): Fragment tolerance in ppm of the PIN features, replacing the per-run measurement (example)
  # fragment_tol_da: 0.5        # --fragment-tol-da (advanced): Fragment tolerance in Da of the PIN features, replacing the per-run measurement (example)
  # peak_filter: "100:20"       # --peak-filter (advanced): Peak filter WINDOW_DA:PEAKS, e.g. 100:20 [default: 100:20 for isobaric data, else off] (example)
  # ethcd_activation: ethcd     # --ethcd-activation (advanced): How EThcD and ETciD spectra are labelled; ethcd | etd
  # ms_level: 2                 # --ms-level (advanced): MS level searched in mzML (MGF, .raw, .d and --chimeric search MS2)
  # model_store: models.parquet # --model-store (advanced): Parquet model store (a file or a partitioned directory) instead of the bundled one (example)
  # model: hcd_qexactive_tryp   # --model (advanced): Model id to load from the model store, skipping the automatic selection (example)
  # gbdt_max_trees: 100         # --gbdt-max-trees (advanced): Trees evaluated per GBDT ensemble, 0 for all [default: 100; all with --glyco] (example)
  # precursor_mono: auto        # --precursor-mono (advanced): Correct each precursor to the monoisotopic peak of its MS1 envelope (--glyco); off | auto

# ── Decoys ──────────────────────────────────────────────────────────────────
decoys:
  # prefix: XXX_      # --decoy-prefix (advanced): Accession prefix that marks a decoy, given to the generated decoys
  # suffix: rev       # --decoy-suffix (advanced): Accession suffix that also marks a decoy (e.g. rev for <accession>_rev decoys) (example)
  # strategy: shuffle # --decoy-strategy: How decoys are generated; shuffle | reverse | sequon | mutate | none

# ── Modes ───────────────────────────────────────────────────────────────────
chimeric:
  # enabled: false    # --chimeric: Also search co-isolated peptides: a second PSM per scan from its MS1 isolation window
  # max_coisolated: 4 # --chimeric-max-coisolated (advanced): Most co-isolated peptides searched per scan with --chimeric
  # max_kl: 0.3       # --chimeric-max-kl (advanced): Largest averagine-envelope KL divergence of an accepted co-isolated precursor (--chimeric)

refine:
  # enabled: false            # --refine: Second pass for further modifications (oxidation, deamidation, ...) over the confident proteins
  # config: refine_tiers.yaml # --refine-config (advanced): YAML file of the --refine modification tier [default: the built-in tier] (example)

# ── Rescoring and FDR ───────────────────────────────────────────────────────
rescoring:
  # psm_fdr: 0.01                     # --psm-fdr: PSM-level FDR: the q-value threshold of the reported PSMs [default: 0.01]
  # protein_fdr: 0.01                 # --protein-fdr: Protein-group q-value threshold of the filtered output [default: none] (example)
  # enabled: false                    # --rescore: Rescore the PIN with Percolator and write q-values, PEPs and the PSMs at --psm-fdr
  # pep: 0.05                         # --pep (advanced): PEP threshold applied with --psm-fdr: a PSM must pass both [default: none] (example)
  # percolator_bin: percolator        # --percolator-bin (advanced): Run --rescore with this external Percolator binary instead of the native engine (example)
  # percolator_docker: false          # --percolator-docker (advanced): Run --rescore with Percolator from its Docker image instead of the native engine
  # percolator_image: "quay.io/biocontainers/percolator:3.7.1--h3b5f4bd_2" # --percolator-image (advanced): Docker image of Percolator, with --percolator-docker or --xl
  # percolator_args: "--testFDR 0.05" # --percolator-args (advanced): Extra arguments for an external Percolator, e.g. "--testFDR 0.05" (example)
  # keep_pin: true                    # --keep-pin (advanced): Keep the PIN after rescoring; true | false
  # predict: [rt]                     # --predict (advanced): Predicted features added to the PIN, comma-separated; rt | ms2 | peptdeep-ms2 | peptdeep-rt | deeplc-rt | none
  # predictor_models: models/         # --predictor-models (advanced): Directory of the exported AlphaPeptDeep and DeepLC models (example)
  # predictor_backend: tract          # --predictor-backend (advanced): ONNX engine of the AlphaPeptDeep and DeepLC models; tract | ort
  # predictor_nce: 28                 # --predictor-nce (advanced): Collision energy given to the MS2 model [default: 28 on Q Exactive, else 30] (example)
  # predictor_instrument: QE          # --predictor-instrument (advanced): Instrument given to the MS2 model, e.g. QE, Lumos, timsTOF [default: from the instrument] (example)
  # predictor_batch: 256              # --predictor-batch (advanced): Peptides per predictor batch
  # proteoform_fdr: 0.05              # --proteoform-fdr (advanced): q-value threshold of proteoform claims [default: the larger of --psm-fdr and 0.05] (example)
  # add_entrapment: false             # --add-entrapment (advanced): Add experimental shuffled entrapment proteins for diagnostic FDP estimates [default: off]
  # entrapment_seed: 1                # --entrapment-seed (advanced): Unitless seed of the experimental --add-entrapment shuffle; use several seeds for a range

# ── Glycopeptides ───────────────────────────────────────────────────────────
glyco:
  # enabled: false            # --glyco: Intact glycopeptide search into a .glyco.pin (needs a glycan database, e.g. --glyco-species)
  # species: human            # --glyco-species: Bundled N-glycan database of --glyco; human | mouse | mouse-large | high-mannose (example)
  # glycan_gdb: glycans.gdb   # --glyco-glycan-gdb (advanced): External .gdb glycan database of --glyco (instead of --glyco-species) (example)
  # glycan_wurcs: glycans.csv # --glyco-glycan-wurcs (advanced): WURCS 2.0 glycan database CSV of --glyco (instead of --glyco-species) (example)
  # core: "n"                 # --glyco-core (advanced): Glycan core of --glyco; n | o
  # tol_ppm: 20               # --glyco-tol-ppm (advanced): Fragment tolerance in ppm of the glyco matching: oxonium ions, core Y ions, backbone, c/z
  # min_core_y: 0             # --glyco-min-core-y (advanced): Fewest trimannosyl-core Y ions of a reported --glyco PSM (0: off)
  # hcd_pair: true            # --glyco-hcd-pair (advanced): On ETD scans, take the candidate backbones from the paired HCD scan of the same precursor; true | false
  # max_peaks: 0              # --glyco-max-peaks (advanced): Most intense peaks considered when generating --glyco candidates (0: all)
  # cz_max_charge: 1          # --glyco-cz-max-charge (advanced): Largest c/z fragment charge of --glyco ETD scoring [default: from whether the spectrum is deconvoluted] (example)
  # y_max_charge: 3           # --glyco-y-max-charge (advanced): Largest glycan Y fragment charge of --glyco
  # retrieval_tol_ppm: 20     # --glyco-retrieval-tol-ppm (advanced): Candidate retrieval tolerance in ppm of --glyco [default: --glyco-tol-ppm on high-res MS2, 0.5 Da on low-res] (example)
  # peptide_first: false      # --glyco-peptide-first (advanced): Peptide-first b/y fragment-index retrieval instead of the glycan-mass branch (slower)
  # index_sequon_only: false  # --glyco-index-sequon-only (advanced): Index only N-X-S/T peptides for --glyco, a much smaller index

# ── Quantification ──────────────────────────────────────────────────────────
quant:
  # quant_fdr: 0.01                    # --quant-fdr: Quantification FDR: q-value threshold of values measured without an identification [default: 0.01]
  # tmt: tmt10                         # --tmt: Isobaric reporter-ion quantification with this labelling kit; tmt6 | tmt10 | tmt11 | tmt16 | tmt18 | tmt32 | tmt35 | itraq4 | itraq8 (example)
  # lfq: false                         # --lfq: Label-free MS1 quantification of the identified precursors
  # label: silac2                      # --label: MS1 labelled-pair quantification (SILAC, dimethyl): a preset or one bracket per channel (example)
  # mbr: false                         # --mbr: Match between runs across two or more inputs (needs --rescore, and --lfq, --tmt or --label)
  # dir: quant_out                     # --quant-dir: Directory of the per-run tables of multi-run quantification (example)
  # tmt_level: 3                       # --tmt-level (advanced): MS level of the reporter ions: 2 (the identified MS2) or 3 (its SPS-MS3 scan) [default: 3 for SPS-MS3 data, else 2] (example)
  # tmt_tol: 20ppm                     # --tmt-tol (advanced): Reporter-ion m/z tolerance, e.g. 20ppm or 0.003da [default: 20ppm (10ppm for tmt32/tmt35), 0.3da on ion-trap MS2] (example)
  # tmt_correction: lot.txt            # --tmt-correction (advanced): Isotope impurity matrix of the kit lot, in quantms text form [default: no correction] (example)
  # tmt_min_purity: 0.7                # --tmt-min-purity (advanced): Quantification gate: least precursor isolation purity (0: off)
  # tmt_min_sn: 0                      # --tmt-min-sn (advanced): Quantification gate: least summed reporter signal-to-noise (0: off)
  # tmt_unmix: auto                    # --tmt-unmix (advanced): Remove the co-isolation interference of high-resolution MS2 reporters; auto | off | on
  # mbr_wrong_log2: 0.5                # --mbr-wrong-log2 (advanced): With --tmt --mbr: RMS log2 deviation from its reference scan above which a transferred profile counts as wrong
  # lfq_tol: 10ppm                     # --lfq-tol (advanced): MS1 m/z tolerance of the isotope chromatograms, e.g. 10ppm [default: 10ppm]
  # lfq_rt_window: 60                  # --lfq-rt-window (advanced): Retention-time half-window around the identifying PSM, in seconds [default: 60; 120 with --glyco] (example)
  # lfq_gaussian_width: 12             # --lfq-gaussian-width (advanced): Experimental: Gaussian peak width for peak detection, in seconds (eight sigma) [default: Savitzky-Golay smoothing] (example)
  # lfq_min_cosine: 0.7                # --lfq-min-cosine (advanced): Least isotope-envelope cosine of a feature marked accepted in lfq.parquet
  # label_reference: 1                 # --label-reference (advanced): Reference channel of the --label ratios, 1-based
  # label_arg_pro: false               # --label-arg-pro (advanced): SILAC: fit the heavy proline made from heavy arginine and add it back to its channel
  # label_2h_enrichment_silac: 0.96    # --label-2h-enrichment-silac (advanced): 2H enrichment of metabolic deuterium labels (Lys4, Leu3)
  # label_2h_enrichment_chemical: 0.99 # --label-2h-enrichment-chemical (advanced): 2H enrichment of chemical deuterium labels (dimethyl)
  # label_heavy_enrichment: 0.99       # --label-heavy-enrichment (advanced): 13C and 15N enrichment of heavy labels, per atom
  # mbr_donor_fdr: 0.01                # --mbr-donor-fdr (advanced): Precursor q-value threshold of a match-between-runs library donor [default: inherits --psm-fdr] (example)
  # quant_transfer_fdr: 0.01           # --quant-transfer-fdr (advanced): q-value threshold of a reported transfer [default: inherits --quant-fdr] (example)
  # quant_channel_fdr: 0.05            # --quant-channel-fdr (advanced): --label: q-value threshold of a channel matched without an identification [default: inherits --quant-fdr] (example)

# Read by `andes cohort plan` and `andes cohort run`; a search ignores this section. The sections above are the
# settings every run of the cohort shares; each run's own settings come from its SDRF row.
# cohort:
#   name: human-xl                 # the default output folder, <name>/ next to this file
#   data_dir: /data/raw            # spectrum files, any layout; <data_dir>/<project>/ is used when present
#   output_dir: /data/human-xl     # runs/<run>/, groups/<group>/ and plan.json
#   sdrfs:                         # one entry per project; paths relative to this file
#     - {project: PXD019110, sdrf: PXD019110.sdrf.tsv}
#     - {project: PXD059766, sdrf: PXD059766.sdrf.tsv}
#   run_name: "{project}.{stem}"   # unique run name; {project} and {stem} are filled in
#   overrides:                     # replace or fill in what a project's SDRF gives
#     - project: PXD019110
#       search: {precursor_tol: 10ppm}   # keys: enzyme, precursor_tol, fixed_mods, variable_mods, xl
#   exclude: []                    # projects listed above but left out of the plan

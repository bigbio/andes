[package]
name = "andes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "andes"
path = "src/bin/andes.rs"

[dependencies]
andes-glyco = { path = "../andes-glyco" }
model = { path = "../model" }
scoring_crate = { path = "../scoring", package = "scoring" }
search = { path = "../search" }
output = { path = "../output" }
input = { path = "../input" }
quant = { path = "../quant" }
model-train = { path = "../model-train" }
# Predicted-spectrum / RT features for the PIN (`--predict`).
onnx-infer = { path = "../onnx-infer" }
clap = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
num_cpus = "1.16"
rayon = "1.10"
rustc-hash = "2"
arrow = "53"
parquet = "53"
# Temp PIN destination for `--rescore` with `--keep-pin false` and no
# `--output-pin`.
tempfile = "3.10"

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
# `malloc_trim` after the protein inference of `quant finalize`.
libc = "0.2"

[features]
default = ["tract"]
# ONNX engine for the third-party predictors of `--predict` (AlphaPeptDeep,
# DeepLC): tract, pure Rust. The bundled andes-rt model needs no engine.
tract = ["onnx-infer/tract"]
# ONNX Runtime engine for those predictors (`--predictor-backend ort`), loaded
# from a shared library at run time (see crates/onnx-infer/README.md).
ort = ["onnx-infer/ort"]
# Native Thermo .raw input (delegates to the input crate's `thermo` feature).
# Not enabled by default: turn on for release builds (`--features thermo`) on a
# toolchain with rustc >= 1.88; opening a `.raw` then needs the .NET 8 runtime
# at runtime. Default builds stay pure-Rust and read mzML/MGF only.
thermo = ["input/thermo"]
# Native Bruker timsTOF `.d` input (delegates to the input crate's `timstof`
# feature). Not enabled by default: turn on with `--features timstof`. Reading a
# `.d` needs no vendor runtime (pure Rust). Default builds read mzML/MGF only.
timstof = ["input/timstof"]

[dev-dependencies]
tempfile = "3.10"
# used by tests/gzip_instrument_detection.rs to inflate the fixture in-process
# (portable: CI runs on windows-latest, so shelling out to gzip is not an option)
flate2 = { workspace = true }
arrow = "53"
parquet = "53"
scoring_crate = { path = "../scoring", package = "scoring" }

[package]
name = "andes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "andes"
path = "src/bin/andes.rs"

# Diagnostic trace tool: reads the legacy binary `.param` format directly.
# Built only with the offline `legacy-param-migrate` feature.
[[bin]]
name = "andes-trace"
path = "src/bin/andes-trace.rs"
required-features = ["legacy-param-migrate"]

[dependencies]
model = { path = "../model" }
scoring_crate = { path = "../scoring", package = "scoring" }
search = { path = "../search" }
output = { path = "../output" }
input = { path = "../input" }
model-train = { path = "../model-train" }
clap = { workspace = true }
num_cpus = "1.16"
rayon = "1.10"
rustc-hash = "2"
thiserror = { workspace = true }
arrow = "53"
parquet = "53"
# Temp PIN destination for `--rescore` without `--output-pin` (and the
# `--keep-pin false` path).
tempfile = "3.10"

[features]
# Native Thermo .raw input (delegates to the input crate's `thermo` feature).
# Not enabled by default: turn on for release builds (`--features thermo`) on a
# toolchain with rustc >= 1.88; opening a `.raw` then needs the .NET 8 runtime
# at runtime. Default builds stay pure-Rust and read mzML/MGF only.
thermo = ["input/thermo"]
# Native Bruker timsTOF `.d` input (delegates to the input crate's `timstof`
# feature). Not enabled by default: turn on with `--features timstof`. Reading a
# `.d` needs no vendor runtime (pure Rust). Default builds read mzML/MGF only.
timstof = ["input/timstof"]
# Offline legacy binary `.param` support: builds the `andes-trace` diagnostic
# binary and honors `.param` seed files for `train`. Off by default — the
# default engine ships no `.param` reader (models live in the Parquet store).
legacy-param-migrate = [
    "scoring_crate/legacy-param-migrate",
    "model-train/legacy-param-migrate",
]

[dev-dependencies]
tempfile = "3.10"
arrow = "53"
parquet = "53"
scoring_crate = { path = "../scoring", package = "scoring" }

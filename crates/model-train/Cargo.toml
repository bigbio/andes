[package]
name = "model-train"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
model = { path = "../model" }
scoring_crate = { path = "../scoring", package = "scoring" }
input = { path = "../input" }
search = { path = "../search" }
rustc-hash = "2"
rayon = "1.10"
thiserror = { workspace = true }
arrow = "53"
parquet = "53"

[features]
# Offline migration of legacy binary `.param` models into the Parquet store.
# Forwards to the scoring crate's `.param` reader. Off by default.
legacy-param-migrate = ["scoring_crate/legacy-param-migrate"]

[dev-dependencies]
tempfile = "3.10"

# Examples that read/migrate the legacy binary `.param` format.
[[example]]
name = "dump_model"
required-features = ["legacy-param-migrate"]

[[example]]
name = "gen_bundled_store"
required-features = ["legacy-param-migrate"]

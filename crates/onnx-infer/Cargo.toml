[package]
name = "onnx-infer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "ONNX inference substrate for proteomics — andes search, quantms-rescoring, de novo"
readme = "README.md"
keywords = ["onnx", "inference", "proteomics", "machine-learning"]
categories = ["science", "algorithms"]

[features]
default = []
# Pure-Rust ONNX Runtime (Apache-2.0). Preferred for an Apache-clean core.
tract = ["dep:tract-onnx"]
# ONNX Runtime (MIT) through the `ort` crate. The runtime library is loaded at
# run time (`load-dynamic`): nothing is downloaded or linked at build time. See
# README "ONNX Runtime backend" for how the shared library is located.
ort = ["dep:ort"]

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
tracing = { workspace = true }

# Classic tract-onnx API (model_for_path / into_optimized / into_runnable).
# 0.21.x pulls liquid → kstring; keep Cargo.lock on kstring ≤2.0.2 until MSRV ≥1.96.
tract-onnx = { version = "0.21.13", optional = true }

# rc.10 targets ONNX Runtime 1.22 and builds on the workspace toolchain; newer
# runtime libraries (1.22+) load through the same C API version.
ort = { version = "=2.0.0-rc.10", optional = true, default-features = false, features = ["std", "load-dynamic"] }

[dev-dependencies]
# Native AGBD decoder for the fixture parity test.
scoring = { path = "../scoring" }
serde_json = "1"
tempfile = "3.10"
# mzML reading for the `rescore_pin` example only.
input = { path = "../input" }
# andes's peptide writer, for parser tests on the strings andes actually writes.
model = { path = "../model" }

[[example]]
name = "rescore_pin"

[[example]]
name = "model_parity"

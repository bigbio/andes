[package]
name = "scoring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
model = { path = "../model" }
rustc-hash = "2"
thiserror = { workspace = true }
byteorder = { workspace = true }
arrow = "53"
parquet = "53"

[features]
# Offline migration of the legacy binary `.param` model format into the
# canonical Parquet `ModelStore`. NOT enabled by default: the default engine
# build ships no `.param` reader. Enable for the one-time migration only.
legacy-param-migrate = []

[dev-dependencies]
tempfile = "3.10"
input = { path = "../input" }

# Diagnostic examples that read the legacy binary `.param` format.
[[example]]
name = "dump_main_ion"
required-features = ["legacy-param-migrate"]

[[example]]
name = "dump_prefix_cache"
required-features = ["legacy-param-migrate"]

[package]
name = "search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
input = { path = "../input" }
memmap2 = "0.9"
model = { path = "../model" }
rayon = "1.10"
rustc-hash = "2"
scoring_crate = { path = "../scoring", package = "scoring" }
serde = { workspace = true }
serde_yaml = { workspace = true }
smallvec = "1"

[features]
# Legacy binary `.param` reader, used only by the end-to-end search regression
# tests that load a real model fixture. Off by default; forwards to scoring.
legacy-param-migrate = ["scoring_crate/legacy-param-migrate"]

[dev-dependencies]
tempfile = "3.10"

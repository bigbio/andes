site_name: andes
site_description: andes, the data-driven peptide search engine of the quantms ecosystem. Documentation, parameters and benchmarks.
site_author: bigbio
site_url: https://andes.quantms.org/

repo_name: bigbio/andes
repo_url: https://github.com/bigbio/andes
edit_uri: ""

# The docs tree is generated by website/build_site.py; see website/README.md.
docs_dir: website/_build/docs
site_dir: website/_site

theme:
  name: material
  logo: assets/andes-icon.svg
  favicon: assets/andes-icon.svg
  palette:
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting started:
      - Install: getting-started/install.md
      - Quick start: getting-started/quickstart.md
  - Distinctive features:
      - Overview: features/index.md
      - Knockoff variant FDR: features/knockoffs.md
      - Site claims and identity: features/sites.md
      - Chimeric cascade: features/chimeric.md
      - Retrieval and model choice: features/retrieval.md
      - Protein inference: features/proteins.md
      - Match between runs: features/mbr.md
      - TMT interference unmixing: features/tmt-unmix.md
  - Guide:
      - How it works: how-it-works.md
      - Scoring models: models.md
      - Optional modes: modes.md
      - Training your own model: training.md
  - Quantification: quantification.md
  - Reference:
      - Command-line parameters: parameters.md
      - Full reference: reference.md
  - Benchmarks:
      - Overview: benchmarks/index.md
      - Glycoproteomics (PXD065680): benchmarks/glyco.md
      - Full report: benchmarks/details.md
  - Ecosystem: ecosystem.md
  - About: about.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/bigbio/andes

validation:
  anchors: warn
